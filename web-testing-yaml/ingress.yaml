apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-testing-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-testing-service
                port:
                  number: 80
